name: Update download count

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-download-count
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'midona-rhel/Poser'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Refresh repo.json through a pull request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const update = require('./.github/scripts/update-download-count.cjs');
            await update({ github, context, core });
