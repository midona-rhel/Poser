name: Architecture boundaries
on:
  pull_request:
  push:
    branches: [main, refactor]
  # Also allows manual validation, including the download-count pull request.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Enforce project dependency graph
        shell: pwsh
        run: ./tools/Test-ProjectBoundaries.ps1
      - name: Validate portable application and documents without the game SDK
        shell: pwsh
        run: |
          dotnet test Poser.Domain.Tests/Poser.Domain.Tests.csproj -c Release --nologo --logger trx --results-directory TestResults
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test Poser.Application.Tests/Poser.Application.Tests.csproj -c Release --nologo --logger trx --results-directory TestResults
          exit $LASTEXITCODE
      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: ./tools/Report-TestFailures.ps1
  full:
    # Compiles every project, including the Dalamud-dependent ones, and runs
    # every test project. Release only: a Debug build deploys to the live game.
    runs-on: windows-latest
    env:
      DALAMUD_HOME: ${{ github.workspace }}\dalamud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath $env:DALAMUD_HOME -Force
      - name: Build solution (Release)
        shell: pwsh
        run: |
          dotnet build Poser.slnx -c Release --nologo
          exit $LASTEXITCODE
      - name: Test solution (Release)
        shell: pwsh
        run: |
          dotnet test Poser.slnx -c Release --no-build --nologo --logger trx --results-directory TestResults
          exit $LASTEXITCODE
      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: ./tools/Report-TestFailures.ps1
  debug-build:
    # Test branches only: builds the Debug plugin output for manual deployment.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'test/')
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DALAMUD_HOME: ${{ github.workspace }}\dalamud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath $env:DALAMUD_HOME -Force
      - name: Build plugin (Debug)
        shell: pwsh
        run: |
          dotnet build Poser/Poser.csproj -c Debug --nologo
          exit $LASTEXITCODE
      - name: Publish the output to a build branch
        # Artifact storage is unreachable from the test sessions; git is not.
        shell: pwsh
        run: |
          $branch = "build/$($env:GITHUB_REF_NAME -replace '/', '-')"
          Set-Location Poser/bin/Debug
          git init -q -b $branch
          git config user.name Midona
          git config user.email midona.rhel@gmail.com
          git add -A
          git commit -q -m "Debug build of $($env:GITHUB_REF_NAME) at $($env:GITHUB_SHA)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$branch"
