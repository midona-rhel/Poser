name: Architecture boundaries
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Enforce project dependency graph
        shell: pwsh
        run: ./tools/Test-ProjectBoundaries.ps1
      - name: Validate portable application and documents without the game SDK
        shell: pwsh
        run: |
          dotnet test Poser.Domain.Tests/Poser.Domain.Tests.csproj -c Release --nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test Poser.Application.Tests/Poser.Application.Tests.csproj -c Release --nologo
          exit $LASTEXITCODE
