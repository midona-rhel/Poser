<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="../../../Picto/src/shared/styles/tokens.css">
  <style>
    /* The WHOLE catalog renders on this one page in one Edge process.
       Every state cell is its own shadow root loading exactly the CSS
       modules that state needs — the same per-state isolation the old
       one-page-per-state flow provided (CSS-module class names like
       .btn or .row collide across modules on a shared page). Custom
       properties from tokens.css inherit into the shadow trees. */
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--color-bg-app);
      color: var(--color-text-primary);
      font-family: var(--font-family);
      font-size: 13px;
    }
    .cell {
      position: absolute;
      background: var(--color-bg-app);
      /* Paint containment clips to the cell and makes it the containing
         block for absolute AND fixed descendants (the modal backdrop),
         WITHOUT promoting a compositing layer — a transform/layer here
         changes alpha-blend rounding by one RGB level and adds an AA
         ring, breaking exactness against the accepted candidates. */
      contain: paint;
    }
  </style>
</head>

  <script src="icon-fixtures.generated.js"></script>
  <script src="sheet-layout.generated.js"></script>

        border-radius: 0 !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        animation: none !important;

      'btn-hover-mid': {
        // Deterministic mid-flight of the 150ms ease hover transition:
        // the candidate hovers for exactly five 1/60s frames = linear
        // progress 5/9; cubic-bezier(.25,.1,.25,1) eases that to
        // 0.852283, and Chromium interpolates rgba PREMULTIPLIED. The

        // — a baked literal is only correct for the themes sharing the
        // dark fill pair.
        css: 'shared/styles/actionButton.module.css',
        html: '<button class="btn">Apply changes</button>',
        postLayout(scope) {
          const btn = scope.querySelector('.btn');
          // Sampling runs with the transition disabled: reading the
          // computed background right after assigning it would start
          // the 150ms transition and return its t=0 (idle) value. The
          // capture is a static frame, so no transition is needed.
          btn.style.transition = 'none';
          const parse = (c) => {
            const m = c.match(/rgba?\(([^)]+)\)/)[1]
              .split(',').map(Number);
            return [m[0], m[1], m[2], m.length > 3 ? m[3] : 1];

          btn.style.background = 'var(--color-subtle-overlay)';
          const hover = parse(getComputedStyle(btn).backgroundColor);
          const t = 0.852283;
          const a = idle[3] + (hover[3] - idle[3]) * t;
          const rgb = [0, 1, 2].map((i) =>
            (idle[i] * idle[3] * (1 - t) + hover[i] * hover[3] * t) / a);

            `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`;
