<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="../../../Picto/src/shared/styles/tokens.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--color-bg-app);
      color: var(--color-text-primary);
      font-family: var(--font-family);
      font-size: 13px;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 24px;
    }
    button, input { margin: 0; }
    .text-flex-demo { display: flex; }
    /* InspectorField.module.css .popover carries the popoverText's font
       metrics (13px / 1.5 / text-primary) as an absolutely positioned
       glass overlay; neutralize only its overlay placement and chrome so
       the typography renders in flow. */
    .popover-text-demo {
      position: static !important;
      max-height: none !important;
      overflow: visible !important;
      background: none !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      animation: none !important;
    }
    .row-demo { width: 272px; --sidebar-row-height: 26px; --row-inset: 1px; }
    .property-demo { width: 272px; }
    .section-demo { width: 272px; }
    .tooltip-shell {
      display: inline-flex;
      padding: 4px 6px;
      border-radius: 4px;
      background: var(--glass-bg);
      border: 1px solid var(--color-border-secondary);
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
      backdrop-filter: blur(16px);
    }
    .dropdown-demo {
      position: relative;
      display: inline-flex;
      width: max-content;
      flex-direction: column;
      gap: 4px;
    }
    .dropdown-demo .drop {
      position: relative;
      width: 100%;
    }
    .modal-demo { height: 220px; }
    .menu-demo { position: relative !important; left: auto !important; top: auto !important; }
    .palette-demo { margin: 0 !important; }
    .selector-icon {
      width: 20px; height: 20px; display: inline-flex;
      align-items: center; justify-content: center; opacity: .5;
    }
    svg { display: block; }
  </style>
</head>
<body>
  <main id="stage"></main>
  <script>
    const root = '../../../Picto/src/';
    const variants = {
      'text-label': {
        // Picto typography: src/app/globals.css body — 13px
        // --font-family at --color-text-primary.
        css: 'app/globals.css',
        html: '<div>Actor display name</div>',
      },
      'text-caption': {
        // src/shared/ui/PropertyRow/PropertyRow.module.css .label.
        css: 'shared/ui/PropertyRow/PropertyRow.module.css',
        html: '<span class="label" style="display:block">Opacity</span>',
      },
      'text-mono': {
        // PropertyRow.module.css .value + .valueMono (CSS-Modules
        // composes flattened into the class list, as property-row does).
        css: 'shared/ui/PropertyRow/PropertyRow.module.css',
        html: '<span class="value valueMono" style="display:block;flex:none;text-align:left">1.000</span>',
      },
      'text-disabled': {
        // src/shared/ui/ContextMenu/ContextMenu.module.css — the REAL
        // .disabled selector on its .item menu row (26px flex row, 6px
        // horizontal padding, 13px text-primary, opacity .4).
        css: 'shared/ui/ContextMenu/ContextMenu.module.css',
        html: '<div class="item disabled" style="width:200px"><span class="label">Unavailable action</span></div>',
      },
      'text-truncated': {
        // ContextMenu.module.css .label — flex:1; min-width:0;
        // overflow:hidden; text-overflow:ellipsis; white-space:nowrap.
        css: 'shared/ui/ContextMenu/ContextMenu.module.css',
        html: '<div class="text-flex-demo" style="width:140px"><span class="label">The quick brown fox jumps over</span></div>',
      },
      'text-truncated-cjk': {
        // ContextMenu.module.css .label idiom — ideographic text with
        // no Latin word boundaries.
        css: 'shared/ui/ContextMenu/ContextMenu.module.css',
        html: '<div class="text-flex-demo" style="width:140px"><span class="label">素早い茶色の狐が飛び跳ねる</span></div>',
      },
      'text-truncated-combining': {
        // ContextMenu.module.css .label idiom — combining acute accents
        // (U+0301) that must stay attached to their base letters.
        css: 'shared/ui/ContextMenu/ContextMenu.module.css',
        html: '<div class="text-flex-demo" style="width:100px"><span class="label">réservé déjà touché</span></div>',
      },
      'text-truncated-emoji': {
        // ContextMenu.module.css .label idiom — an astral-plane emoji
        // (U+1F600, a UTF-16 surrogate pair) inside the run.
        css: 'shared/ui/ContextMenu/ContextMenu.module.css',
        html: '<div class="text-flex-demo" style="width:110px"><span class="label">Emoji 😀 marker overflow test</span></div>',
      },
      'text-truncated-fit': {
        // ContextMenu.module.css .label idiom — content narrower than
        // the box: no overflow, no ellipsis.
        css: 'shared/ui/ContextMenu/ContextMenu.module.css',
        html: '<div class="text-flex-demo" style="width:140px"><span class="label">The quick brown fox</span></div>',
      },
      'text-truncated-narrow': {
        // ContextMenu.module.css .label idiom — a box narrower than the
        // ellipsis glyph itself.
        css: 'shared/ui/ContextMenu/ContextMenu.module.css',
        html: '<div class="text-flex-demo" style="width:6px"><span class="label">Unreachable</span></div>',
      },
      'text-truncated-flow': {
        // ContextMenu.module.css .label in a fixed 140px flex slot with
        // a visible following sibling at flex gap 0: the sibling starts
        // at the truncation box edge.
        css: 'shared/ui/ContextMenu/ContextMenu.module.css',
        html: '<div class="text-flex-demo"><span class="label" style="flex:none;width:140px">The quick brown fox jumps over</span><span>Next</span></div>',
      },
      'text-wrapped': {
        // src/shared/ui/GlassModal/GlassModal.module.css .helpText —
        // 11px --color-text-tertiary at line-height 1.4.
        css: 'shared/ui/GlassModal/GlassModal.module.css',
        html: '<div class="helpText" style="width:220px">Poser keeps the incoming state and restores it exactly when the override is removed.</div>',
      },
      'text-wrapped-newline': {
        // src/shared/ui/InspectorField/InspectorField.module.css
        // .popover .popoverText — 13px text-primary at line-height 1.5,
        // white-space: pre-wrap preserving the explicit newline.
        css: 'shared/ui/InspectorField/InspectorField.module.css',
        html: '<div class="popover popover-text-demo" style="width:200px"><div class="popoverText">First line\nSecond block that wraps onward, and onward.</div></div>',
      },
      'text-wrapped-overwide': {
        // GlassModal.module.css .helpText in a 120px box — the over-wide
        // token overflows its line (CSS overflow-wrap: normal).
        css: 'shared/ui/GlassModal/GlassModal.module.css',
        html: '<div class="helpText" style="width:120px">A veryverylongunbrokentoken overflows.</div>',
      },
      'text-wrapped-flow': {
        // GlassModal.module.css .helpText wrapped at 160px with a
        // body-text block sibling below (block flow, margin 0): the
        // wrap block's height positions the sibling.
        css: 'shared/ui/GlassModal/GlassModal.module.css',
        html: '<div class="helpText" style="width:160px">Poser keeps the incoming state and restores it exactly.</div><div>After</div>',
      },
      'text-ws-collapse': {
        // GlassModal.module.css .helpText (white-space: normal) —
        // repeated spaces and the newline collapse to single spaces.
        css: 'shared/ui/GlassModal/GlassModal.module.css',
        html: '<div class="helpText" style="width:220px">Collapse   runs of   spacing\nacross   breaks in the   source text.</div>',
      },
      'text-ws-prewrap': {
        // InspectorField.module.css .popover .popoverText (white-space:
        // pre-wrap) — doubled/tripled spaces stay, the newline breaks.
        css: 'shared/ui/InspectorField/InspectorField.module.css',
        html: '<div class="popover popover-text-demo" style="width:200px"><div class="popoverText">Keep  two   spaces\nand the break</div></div>',
      },
      'text-ws-tab': {
        // InspectorField.module.css .popover .popoverText — preserved
        // tabs advance to 8-space-width stops (CSS default tab-size: 8).
        css: 'shared/ui/InspectorField/InspectorField.module.css',
        html: '<div class="popover popover-text-demo" style="width:260px"><div class="popoverText">a\tbc\tdef\ttab stops</div></div>',
      },
      'text-ws-crlf': {
        // text-wrapped-newline's exact content with CRLF separators —
        // the HTML parser normalizes CRLF to LF before layout, so this
        // reference must be identical to the LF twin's.
        css: 'shared/ui/InspectorField/InspectorField.module.css',
        html: '<div class="popover popover-text-demo" style="width:200px"><div class="popoverText">First line\r\nSecond block that wraps onward, and onward.</div></div>',
      },
      'text-align-end': {
        // src/shared/ui/PropertyRow/PropertyRow.module.css — .row with
        // .label and text-align:right .value / .valueMono: the real
        // Picto end-alignment grammar.
        css: 'shared/ui/PropertyRow/PropertyRow.module.css',
        html: '<div class="row" style="width:200px"><span class="label">Opacity</span><span class="value">1.000</span></div><div class="row" style="width:200px"><span class="label">Scale</span><span class="value valueMono">0.750</span></div>',
      },

      };
      document.head.appendChild(link);
    }
