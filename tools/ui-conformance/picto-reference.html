    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--color-bg-app);
      color: var(--color-text-primary);
      font-family: var(--font-family);
      font-size: 13px;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 24px;
    }
    button, input { margin: 0; }
    .text-flex-demo { display: flex; }
    /* InspectorField.module.css .popover carries the popoverText's font
       metrics (13px / 1.5 / text-primary) as an absolutely positioned
       glass overlay; neutralize only its overlay placement and chrome so
       the typography renders in flow. */
    .popover-text-demo {
      position: static !important;
      max-height: none !important;
      overflow: visible !important;
      background: none !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      animation: none !important;
    }
    .row-demo { width: 272px; --sidebar-row-height: 26px; --row-inset: 1px; }
    .property-demo { width: 272px; }
    .section-demo { width: 272px; }
    .tooltip-shell {
      display: inline-flex;
      padding: 4px 6px;
      border-radius: 4px;
      background: var(--glass-bg);
      border: 1px solid var(--color-border-secondary);
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
      backdrop-filter: blur(16px);
    }
    .dropdown-demo {
      position: relative;
      display: inline-flex;
      width: max-content;
      flex-direction: column;
      gap: 4px;
    }
    .dropdown-demo .drop {
      position: relative;
      width: 100%;
    }
    .modal-demo { height: 220px; }
    .menu-demo { position: relative !important; left: auto !important; top: auto !important; }
    .palette-demo { margin: 0 !important; }
    .selector-icon {
      width: 20px; height: 20px; display: inline-flex;
      align-items: center; justify-content: center; opacity: .5;
    }
    svg { display: block; }
  </style>
</head>

      'btn-hover-exit': {

        html: '<button class="btn">Apply changes</button>',

      'btn-hover-mid': {
        // Deterministic mid-flight of the 150ms ease hover transition:
        // the candidate hovers for exactly five 1/60s frames = linear
        // progress 5/9; cubic-bezier(.25,.1,.25,1) eases that to
        // 0.852283, and Chromium interpolates rgba PREMULTIPLIED. The
        // endpoints are THEME values (.btn background and the hover
        // --color-subtle-overlay), so the midpoint is computed after
        // the stylesheet loads from the active theme's resolved colors
        // — a baked literal is only correct for the themes sharing the
        // dark fill pair.
        css: 'shared/styles/actionButton.module.css',
        html: '<button class="btn">Apply changes</button>',
        postLayout() {
          const btn = document.querySelector('.btn');
          // Sampling runs with the transition disabled: reading the
          // computed background right after assigning it would start
          // the 150ms transition and return its t=0 (idle) value. The
          // capture is a static frame, so no transition is needed.
          btn.style.transition = 'none';
          const parse = (c) => {
            const m = c.match(/rgba?\(([^)]+)\)/)[1]
              .split(',').map(Number);
            return [m[0], m[1], m[2], m.length > 3 ? m[3] : 1];
          };
          const idle = parse(getComputedStyle(btn).backgroundColor);
          btn.style.background = 'var(--color-subtle-overlay)';
          const hover = parse(getComputedStyle(btn).backgroundColor);
          const t = 0.852283;
          const a = idle[3] + (hover[3] - idle[3]) * t;
          const rgb = [0, 1, 2].map((i) =>
            (idle[i] * idle[3] * (1 - t) + hover[i] * hover[3] * t) / a);
          btn.style.background =
            `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`;
        },

          btn.style.transition = 'none';
          // Five fixed 1/60s candidate advances through the 150ms
          // cubic-bezier(.4,0,.22,1) transition.
          const x1 = .4, y1 = 0, x2 = .22, y2 = 1, x = 5 / 9;
          const sample = (a, b, t) =>
            ((1 - 3 * b + 3 * a) * t + (3 * b - 6 * a)) * t * t
              + 3 * a * t;
          const slope = (a, b, t) =>
            3 * (1 - 3 * b + 3 * a) * t * t
              + 2 * (3 * b - 6 * a) * t + 3 * a;
          let u = x;
          for (let i = 0; i < 8; i++) {
            const d = slope(x1, x2, u);
            if (Math.abs(d) < 1e-6) break;
            u = Math.max(0, Math.min(1, u - (sample(x1, x2, u) - x) / d));
          }
          const eased = sample(y1, y2, u);
          btn.style.opacity = String(.8 + .2 * eased);
          btn.style.background =
            `color-mix(in srgb, var(--color-hover-overlay) ${eased * 100}%, transparent)`;

        html: '<div class="menu menu-demo"><div class="items"><div class="item focused"><span class="iconSlot">◎</span><span class="label">Set game target</span></div><div class="item"><span class="iconSlot">◉</span><span class="label">Hide</span></div><div class="item"><span class="iconSlot">✎</span><span class="label">Rename…</span></div><div class="separator"></div><div class="item danger"><span class="iconSlot">×</span><span class="label">Despawn</span></div></div></div>',
      },
      'modal': {
        css: [
          'shared/ui/GlassModal/GlassModal.module.css',
          'shared/styles/actionButton.module.css',
        ],
        html: '<div class="backdrop"><section class="panel sm modal-demo"><header class="header"><span class="title">Import pose</span><button class="closeBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></header><div class="body">Apply heroic-stand.pose to Midona Rhel?</div><footer class="footer"><button class="btn">Cancel</button><button class="btn btnPrimary">Import</button></footer></section></div>',
      },
    };
    const params = new URLSearchParams(location.search);
    const theme = params.get('theme') || 'dark';
    const light = theme === 'light' || theme === 'lightgray';
    document.documentElement.dataset.theme = theme;
    document.documentElement.dataset.mantineColorScheme =
      light ? 'light' : 'dark';
    document.documentElement.style.colorScheme =
      light ? 'light' : 'dark';
    const name = params.get('component') || 'action-button';
    // Icon variants are generated from the shipped source registry
    // (generate-icon-fixtures.py) rather than pasted here.
    Object.assign(variants, (window.iconFixtures && window.iconFixtures.variants) || {});
    const entry = variants[name];
    if (!entry) throw new Error(`Unknown component: ${name}`);
    const styles = Array.isArray(entry.css) ? entry.css : [entry.css];
    let loaded = 0;
    for (const source of styles) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = root + source;
      link.onload = () => {
        if (++loaded === styles.length) {
          // A loaded stylesheet is not yet APPLIED: computed styles at
          // link.onload can still be UA defaults (ButtonFace). Two
          // animation frames guarantee a style recalc with the sheet
          // in effect before any variant samples computed colors.
          if (entry.postLayout)
            requestAnimationFrame(() => requestAnimationFrame(() => {
              entry.postLayout();
              document.documentElement.dataset.ready = 'true';
            }));
          else
            document.documentElement.dataset.ready = 'true';
        }
      };
      document.head.appendChild(link);
    }
    document.getElementById('stage').innerHTML = entry.html;
  </script>
</body>
